<div class="login-page" [@routerTransition]>
    <div class="row justify-content-md-center">
        <div class="col-lg-4 p-3 bg-white rounded">
            <img src="assets/images/logo-320-grey.png" class="img-fluid mt-3" />
            <h4 class="mt-2 font-weight-light">Investor Portal</h4>
            <div *ngIf="varStatus === 'LOGIN_NOT_FOUND'">Login not found</div>
            <div *ngIf="varStatus === 'PASSWORD_INVALID'">Password invalid</div>
            <form name="form" (ngSubmit)="onLoggedin()" #f="ngForm" novalidate>
                <div class="form-content">
                    <div class="form-group">
                        <input type="text" [(ngModel)]="model.username" #username="ngModel" required class="form-control input-underline input-lg"
                               name="username" placeholder="Username">
                        <div *ngIf="f.submitted && !username.valid" class="help-block">Email is required</div>
                    </div>

                        <div class="row">
                        <div class="col-lg-10 col-9">
                            <div class="form-group">
                            <input [type]="hide ? 'password' : 'text'" [(ngModel)]="model.password" #password="ngModel" required class="form-control input-underline input-lg"
                                   name="password" placeholder="Password">
                            <div *ngIf="f.submitted && !password.valid" class="help-block">Password is required</div>
                            </div>
                        </div>
                        <div class="col-lg-2 col-3">
                            <div class="btn p-0">
                                <mat-icon class=" mt-3 float-left" (click)="eyeFunction()">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                            </div>
                        </div>

                    </div>
                </div>
                <button class="btn rounded-btn" (click)="f.ngSubmit.emit()" [disabled]="!f.form.valid">{{ 'Login' | translate }}</button>
                &nbsp;
                <!--<a class="btn rounded-btn" [routerLink]="['/signup']">{{ 'Register' | translate }}</a>-->
            </form>
        </div>
    </div>
</div>
