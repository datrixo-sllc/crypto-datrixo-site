<div class="row">
    <div class="col-lg-6 mb-3">
        <button class="btn btn-outline-secondary mr-3" (click)="onClose()">Back to List</button>
        <button class="btn btn-primary mr-3" (click)="onEdit()">Edit Restaurant</button>
        <button class="btn btn-secondary" (click)="onDelete()">Delete Restaurant</button>
    </div>
</div>
<div class="row mt-3" *ngIf="item">
    <div class="col-lg-3 my-0">
        <div class="header-content mx-auto">
            <div class="text-center mb-5">
                <img [src]="imgSrc" class="img-fluid" alt="" name="itemImage" *ngIf="imgSrc">
            </div>

        </div>
    </div>
    <div class="col-lg-9 my-0 pl-lg-5">
        <div class="form-group row pt-0">
            <label class="col-lg-3 col-form-label pt-0">Username</label>
            <div class="col-lg-9">
                <input class="form-control-plaintext" readonly name="zipcode" [value]="item.username"/>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-lg-3 col-form-label">User Type</label>
            <div class="col-lg-9">
                <input class="form-control-plaintext" readonly name="name" [value]="item.userType"/>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-lg-3 col-form-label">Email</label>
            <div class="col-lg-9">
                <input class="form-control-plaintext" readonly name="description" [value]="item.email"/>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-lg-3 col-form-label">Phone</label>
            <div class="col-lg-9">
                <input class="form-control-plaintext" readonly name="phone" [value]="item.phone"/>
            </div>
        </div>
    </div>
</div>
