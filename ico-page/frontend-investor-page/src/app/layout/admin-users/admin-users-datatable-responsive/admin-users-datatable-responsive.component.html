<div class="row mb-0">
    <div class="col-auto">
        <button class="btn btn-outline-secondary form-control" (click)="onAddItem()">Add Restaurant</button>
    </div>
    <div class="col-auto">
        <button class="btn btn-outline-secondary form-control mr-3"
                (click)="onRefresh()">Refresh
        </button>
    </div>
</div>
<div class="row mt-3">
    <div class="col-12">
        <div class="mat-elevation-z8">
            <table mat-table [dataSource]="dataSource">

                <ng-container matColumnDef="imageContent">
                    <th mat-header-cell *matHeaderCellDef> Image</th>
                    <td mat-cell *matCellDef="let element" data-label='imageContent'>
                        <img [src]="sanitizer.bypassSecurityTrustUrl('data:image/png;base64,' + element.imageContent)"
                             width="33px" height="33px" class="img-fluid" alt="" *ngIf="element.imageContent">
                    </td>
                </ng-container>

                <ng-container matColumnDef="username">
                    <th mat-header-cell *matHeaderCellDef> Username</th>
                    <td mat-cell *matCellDef="let element" data-label='Name'>
                        <span  class="m-card-title">{{element.username | truncate:[90]}}</span></td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef> Name</th>
                    <td mat-cell *matCellDef="let element" data-label='Name'>
                        <span  class="m-card-title">{{element.name | truncate:[90]}}</span></td>
                </ng-container>

                <ng-container matColumnDef="zipcode">
                    <th mat-header-cell *matHeaderCellDef> Zip</th>
                    <td mat-cell *matCellDef="let element"
                        data-label='Form type'> {{element.zipcode}} </td>
                </ng-container>

                <ng-container matColumnDef="phone">
                    <th mat-header-cell *matHeaderCellDef> Phone</th>
                    <td mat-cell *matCellDef="let element"
                        data-label='Form type'> {{element.phone}} </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="star">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button [matMenuTriggerFor]="menu"
                                [matMenuTriggerData]="{elementId: element.id}">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
        <mat-paginator [ngStyle]="{display: dataSourceLenth > 5 ? 'block' : 'none'}"
                       [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
    </div>


    <mat-menu #menu="matMenu">
        <ng-template matMenuContent let-elementId="elementId">
            <button mat-menu-item
                    (click)="$event.preventDefault(); $event.stopPropagation(); onItemView(elementId)">
                <mat-icon>grade</mat-icon>
                <span>View</span>
            </button>
            <button mat-menu-item (click)="$event.preventDefault(); $event.stopPropagation(); onEditItem(elementId)">
                <mat-icon>build</mat-icon>
                <span>Edit</span>
            </button>
        </ng-template>
    </mat-menu>
</div>
