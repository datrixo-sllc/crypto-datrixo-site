<div class="row">
    <div class="col-lg-6 mb-3">
        <button class="btn btn-outline-secondary mr-3" (click)="onClose()">Back to List</button>
        <button class="btn btn-primary mr-3" (click)="onEdit()">Edit Item</button>
        <button class="btn btn-secondary" (click)="onDelete()">Delete Item</button>
    </div>
</div>
<div class="row mt-3" *ngIf="item">
    <div class="col-lg-5 my-0">

    </div>
    <div class="col-lg-7 my-0 pl-lg-5">
        <div class="form-group row">
            <label class="col-lg-3 col-form-label">Name</label>
            <div class="col-lg-9">
                <input class="form-control-plaintext" readonly name="name" [value]="item.name"/>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-lg-3 col-form-label">Description</label>
            <div class="col-lg-9">
                <input class="form-control-plaintext" readonly name="description" [value]="item.description"/>
            </div>
        </div>
    </div>
</div>
