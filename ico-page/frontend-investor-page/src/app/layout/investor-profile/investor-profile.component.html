<div [@routerTransition]>
    <app-page-header [heading]="'Investor Profile'" [icon]="'fa-user'"></app-page-header>
    <div class="row">
        <div class="col-lg-12">
            <h4>Personal Information</h4>
            <form role="form">
                <div class="row">
                    <div class="col-lg-1">
                        <fieldset class="form-group">
                            <label>Title</label>
                            <select class="form-control" [(ngModel)]="userData.title" name="title">
                                <option value="MR">Mr.</option>
                                <option value="MRS">Mrs.</option>
                            </select>
                        </fieldset>
                    </div>
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>First Name</label>
                            <input class="form-control" [(ngModel)]="userData.firstName" name="firstName" />
                        </fieldset>
                    </div>
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Last Name</label>
                            <input class="form-control"[(ngModel)]="userData.lastName"name="lastName" />
                        </fieldset>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Business Email</label>
                            <input class="form-control" [value]="userData.username" disabled />
                        </fieldset>
                    </div>
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Phone</label>
                            <input class="form-control" [(ngModel)]="userData.phone" name="phone" />
                        </fieldset>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <h4>Company Information</h4>
            <form role="form">
                <div class="row">
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Company Name</label>
                            <input class="form-control" [(ngModel)]="userData.organizationName" disabled name="organizationName" />
                        </fieldset>
                    </div>
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Incorporate Date</label>
                            <input class="form-control"
                                   [ngModel]="userData.incorporateDate | date:'yyyy-MM-dd'"
                                   (ngModelChange)="userData.incorporateDate = $event"
                                   disabled name="incorporateDate" />
                        </fieldset>
                    </div>
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Phone</label>
                            <input class="form-control" [(ngModel)]="userData.organizationPhone" disabled name="organizationPhone" />
                        </fieldset>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Street Address</label>
                            <input class="form-control" [(ngModel)]="userData.streetAddress" disabled name="streetAddress" />
                        </fieldset>
                    </div>
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>City</label>
                            <input class="form-control" [(ngModel)]="userData.city" disabled name="city" />
                        </fieldset>
                    </div>
                    <div class="col-lg-2">
                        <fieldset class="form-group">
                            <label>State</label>
                            <input class="form-control" [(ngModel)]="userData.state" disabled name="state" />
                        </fieldset>
                    </div>
                    <div class="col-lg-2">
                        <fieldset class="form-group">
                            <label>Zip</label>
                            <input class="form-control" [(ngModel)]="userData.zip" disabled name="zip" />
                        </fieldset>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-3">
                        <fieldset class="form-group">
                            <label>Country</label>
                            <input class="form-control" [(ngModel)]="userData.country" disabled name="country" />
                        </fieldset>
                    </div>
                </div>
                <button type="submit" class="mr-2 btn btn-secondary" (click)="onUpdateUserData()">Update Profile</button>
                <button type="reset" class="btn btn-secondary" (click)="onReset()">Reset</button>
            </form>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-lg-12">
            <button class="btn btn-primary" (click)="openResetPassword()">Reset Password</button>
            <ng-template #modalResetPasswordWindow let-c="close" let-d="dismiss">
                <div class="modal-header">
                    <h4 class="modal-title">Reset Password</h4>
                    <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form name="form" (ngSubmit)="onResetPassword()" #f="ngForm" novalidate>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-lg-12">
                                <fieldset class="form-group">
                                    <label>New Password</label>
                                    <input type="password" [(ngModel)]="newPassword" name="newPassword" #newPasswordF="ngModel" class="form-control" required />
                                    <div *ngIf="f.submitted && !newPasswordF.valid" class="help-block">Email is required</div>
                                </fieldset>
                                <fieldset class="form-group">
                                    <label>Reenter New Password</label>
                                    <input type="password" [(ngModel)]="newPasswordReent" name="newPasswordReent" #newPasswordReentF="ngModel" class="form-control"  required />
                                    <div *ngIf="f.submitted && !newPasswordReentF.valid" class="help-block">Password is required</div>
                                    <div *ngIf="!checkPassword()" class="help-block">Reenter password is not same</div>
                                </fieldset>
                                <fieldset class="form-group">
                                    <label>Current Password</label>
                                    <input type="password" [(ngModel)]="currentPassword" name="currentPassword" #currentPasswordF="ngModel" class="form-control"  required />
                                    <div *ngIf="f.submitted && !currentPasswordF.valid" class="help-block">Email is required</div>
                                </fieldset>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="f.ngSubmit.emit()" [disabled]="!f.form.valid || !checkPassword()">Reset Password</button>
                        <button type="button" class="btn btn-secondary" (click)="c('Close click')">Close</button>
                    </div>
                </form>
            </ng-template>
        </div>
    </div>


</div>
