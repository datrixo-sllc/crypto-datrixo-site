<ngx-datatable
    #table
    class='bootstrap'
    style="margin-top: 1.2em; word-wrap: break-word; word-break: break-all; white-space: normal;"
    [columnMode]="'force'"
    [headerHeight]="20"
    [footerHeight]="20"
    [rowHeight]="'auto'"
    [limit]="10"
    [rows]='rows'>
    <ngx-datatable-column name="address" [width]="220">
        <ng-template let-column="column" ngx-datatable-header-template>
            <div class="header-class">Address</div>
        </ng-template>
        <ng-template let-row="row" ngx-datatable-cell-template>
            <a href="https://etherscan.io/address/{{row.address}}" target="_blank">{{row.address}}</a>
        </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="timeDate">
        <ng-template let-column="column" ngx-datatable-header-template>
            <div class="header-class">Time/Date</div>
        </ng-template>
        <ng-template let-row="row" ngx-datatable-cell-template>
            {{row.timeDate | date:'medium'}}
        </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="shareTokens">
        <ng-template let-column="column" ngx-datatable-header-template>
            <div class="header-class">Equity Tokens</div>
        </ng-template>
        <ng-template let-row="row" ngx-datatable-cell-template>
            {{row.shareTokens}}
        </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="share">
        <ng-template let-column="column" ngx-datatable-header-template>
            <div class="header-class">Equity (%)</div>
        </ng-template>
        <ng-template let-row="row" ngx-datatable-cell-template>
            {{row.share}}
        </ng-template>
    </ngx-datatable-column>
</ngx-datatable>
