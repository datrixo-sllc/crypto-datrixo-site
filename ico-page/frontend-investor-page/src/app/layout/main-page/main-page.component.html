<div [@routerTransition]>
<app-page-header [heading]="'Datrixo Equity'" [icon]="'fa-certificate'"></app-page-header>
    <div class="row">
        <div class="col-sm-6 col-md-5 col-lg-4 col-xl-3">
            <div class="card bg-white mb-3 border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">Total Invested</h5>
                    <h2 class="card-title">${{userData.totalInvestedInt | number}}<small>.{{userData.totalInvestedDec}}</small></h2>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-md-5 col-lg-5 col-xl-4">
            <div class="card bg-white mb-3 border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">Current Value Estimate</h5>
                    <h2 class="card-title text-success">${{userData.valueEstimateInt | number}}<small>.{{userData.valueEstimateDec}}</small></h2>
                </div>
            </div>
        </div>
    </div>
</div>
