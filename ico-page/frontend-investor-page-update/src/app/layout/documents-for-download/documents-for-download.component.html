<div [@routerTransition]>
    <app-dinamic-page-header [header]="header" [heading]="headingStr" [icon]="headingIcon"></app-dinamic-page-header>
    <div class="row">
        <div class="col-lg-12" *ngIf="viewList&& !itemForAdd && items">
        <app-documents-for-download-datatable [items]="items"
                            (onEditItemEmit)="onEdit($event)"
                            (onAddItemEmit)="onAddItem($event)"
                            (onRefreshEmit)="onRefresh($event)"
                            (onViewtemEmit) = "onVieItem($event)"></app-documents-for-download-datatable>
        </div>
        <div class="col-lg-12" *ngIf="!viewList && !itemForAdd && !itemForEdit && selectedItem">
            <app-documents-for-download-detail [id]="selectedItem.id"
                            (closeEmit)="onCloseDetail($event)"
                            (editEmit)="onEditDetail($event)"></app-documents-for-download-detail>
        </div>
        <div class="col-lg-12" *ngIf="!viewList && !itemForAdd && itemForEdit && selectedItem">
            <app-documents-for-download-edit [id]="selectedItem.id"
                          (backListEmit)="onBackList($event)"
                          (backItemEmit)="onBackItem($event)"></app-documents-for-download-edit>
        </div>
        <div class="col-lg-12" *ngIf="viewList && itemForAdd">
            <app-documents-for-download-add (backListEmit)="onBackList($event)"></app-documents-for-download-add>
        </div>
    </div>
</div>
