<div class="row">
    <div class="col-lg-6 mb-3">
        <button class="btn btn-outline-secondary mr-3" (click)="onBackList()">Back to List</button>
        <button class="btn btn-outline-secondary mr-3" (click)="onBackItem()">Back to Item</button>
        <button class="btn btn-outline-secondary mr-3" (click)="init()">Revert</button>
        <button class="btn btn-outline-success mr-3" (click)="onSubmitItemUpdate()">Update Item</button>
    </div>
</div>
<div class="row mt-3">
    <div class="col-lg-7 my-0">
        <div class="form-group row">
            <label class="col-lg-2 col-form-label">Document Type<sup
                class="h6 text-danger font-weight-bold">&lowast;</sup></label>
            <div class="col-lg-10">
                <select class="form-control" name="docType" [(ngModel)]="requestItemData.docType">
                    <option [ngValue]="'PPM'">PPM</option>
                    <option [ngValue]="'SUBSCRIPTION_AGREEMENT'">SUBSCRIPTION_AGREEMENT</option>
                    <option [ngValue]="'SAFE_T'">SAFE_T</option>
                    <option [ngValue]="'SAFE_T_OR_SA'">SAFE_T_OR_SA</option>
                </select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-lg-2 col-form-label">Actual<sup
                class="h6 text-danger font-weight-bold">&lowast;</sup></label>
            <div class="col-lg-10">
                <select class="form-control" name="actual" [(ngModel)]="requestItemData.actual">
                    <option [ngValue]="true">True</option>
                    <option [ngValue]="false">False</option>
                </select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-lg-2 col-form-label">Start Date<sup
                class="h6 text-danger font-weight-bold">&lowast;</sup></label>
            <div class="col-lg-10">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Select Date</mat-label>
                    <input matInput [matDatepicker]="picker"
                           [(ngModel)]="selectedDate"
                           (dateChange)="onDateChange($event)"
                           name="loadDate"
                           [min]="minDate"
                           [max]="maxDate"
                           readonly>
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker
                                    startView="year"
                                    [startAt]="startDate">
                    </mat-datepicker>
                </mat-form-field>
            </div>
        </div>
    </div>


</div>
