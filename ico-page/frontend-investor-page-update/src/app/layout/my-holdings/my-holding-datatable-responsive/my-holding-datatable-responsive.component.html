<div class="row mt-3">
    <div class="col-12">
        <div class="mat-elevation-z8">
            <table mat-table [dataSource]="dataSource">
                <ng-container matColumnDef="asset">
                    <th mat-header-cell *matHeaderCellDef> Asset</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label="Asset:">
                        Datrixo Equity
                    </td>
                </ng-container>

                <ng-container matColumnDef="address">
                    <th mat-header-cell *matHeaderCellDef> Address</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label="Address: ">
                        <a href="https://{{etherNet}}/tx/{{element.address}}"
                           title="{{element.address}}"
                           target="_blank">...{{element.address | slice:-10}}</a>
                    </td>
                </ng-container>

                <ng-container matColumnDef="createDate">
                    <th mat-header-cell *matHeaderCellDef> Date</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label="Date:">
                        {{ element.createDate | date }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="initialInvest">
                    <th mat-header-cell *matHeaderCellDef> Initial Invest</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label="Date:">
                        {{ element.initialInvest }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="paidPrice">
                    <th mat-header-cell *matHeaderCellDef> Paid Price</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label="Paid Price:">
                        ${{ element.paidPrice | number: '1.1-2' }}
                    </td>
                </ng-container>


                <ng-container matColumnDef="docs">
                    <th mat-header-cell *matHeaderCellDef> Docs</th>
                    <td mat-cell *matCellDef="let element">
                        <a href="javascript:void(0);" (click)="onOpenDocsWindow(element.signedDocuments)">
                            {{ element.signedDocuments?.length || 0 }} legal docs
                        </a>
                    </td>
                </ng-container>


                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <mat-paginator [ngStyle]="{display: dataSourceLenth > 5 ? 'block' : 'none'}"
                           [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
        </div>
    </div>
</div>

<ng-template #modalDocsWindow  let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title">Documents</h4>
        <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <ul>
            <li *ngFor="let doc of arrayDocs">
                <a href="javascript:void(0)" (click)="onViewDocument(doc, $event)">{{ getDocLabel(doc) }}</a>
            </li>
        </ul>
    </div>


</ng-template>
