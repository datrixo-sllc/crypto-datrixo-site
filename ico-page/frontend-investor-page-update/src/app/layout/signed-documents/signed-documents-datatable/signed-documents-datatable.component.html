<div class="row mb-0">
    <div class="col-lg-5">
        <input class="form-control"
               type='text'
               placeholder='Filter by User and Load Date'
               (keyup)='updateFilter($event)'
        />
    </div>
    <!--<div class="col-lg-3">
        <button class="btn btn-outline-secondary mr-3" (click)="onAddItem()">Add Item</button>
    </div>-->
</div>
<div class="row">
    <div class="col-lg-12">
        <ngx-datatable
            #table
            class='bootstrap'
            style="margin-top: 1.2em; font-size: 1em;"
            [columnMode]="'flex'"
            [headerHeight]="20"
            [footerHeight]="60"
            [rowHeight]="'auto'"
            [limit]="10"
            [selected]="selected"
            [selectionType]="'single'"
            (select)='onSelect($event)'
            [rows]='rows'>
            <ngx-datatable-column name="userName" [flexGrow]="20">
                <ng-template let-column="column" ngx-datatable-header-template>
                    <div class="header-class">User</div>
                </ng-template>
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.username}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="holderAccount" [flexGrow]="30">
                <ng-template let-column="column" ngx-datatable-header-template>
                    <div class="header-class">Transaction address</div>
                </ng-template>
                <ng-template let-row="row" ngx-datatable-cell-template>
                    @if (row.holderAccount) {
                    <a href="https://{{etherNet}}/tx/{{row.holderAccount}}"
                        target="_blank"
                        title="{{row.holderAccount}}"
                        (click)="openTransaction(row, $event)">
                        {{row.holderAccount | slice:0:30}}...</a>
                    } @else {
                        no attached transaction address
                    }
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="docType" [flexGrow]="20">
                <ng-template let-column="column" ngx-datatable-header-template>
                    <div class="header-class">Document Type</div>
                </ng-template>
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.docType}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="loadDate" [flexGrow]="30">
                <ng-template let-column="column" ngx-datatable-header-template>
                    <div class="header-class">Load Date</div>
                </ng-template>
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.loadDate | date:'dd.MM.yyyy HH:mm'}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-footer>
                <ng-template
                    ngx-datatable-footer-template
                    let-rowCount="rowCount"
                    let-pageSize="pageSize"
                    let-offset="offset">
                    <div class="datatable-footer-inner d-flex justify-content-between align-items-center w-100 custom-datatable-footer">
                        <div class="page-count">
                            Всего записей: {{rowCount}}
                        </div>
                        <datatable-pager
                            class="custom-datatable-pager"
                            [count]="rowCount"
                            [pageSize]="pageSize"
                            [offset]="offset"
                            (change)="table.onFooterPage($event)">
                        </datatable-pager>
                    </div>
                </ng-template>
            </ngx-datatable-footer>
        </ngx-datatable>
    </div>
</div>
