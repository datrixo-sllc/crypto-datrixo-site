<div class="row mt-3">
    <div class="col-12">
        <div class="mat-elevation-z8">
            <table mat-table [dataSource]="dataSource">
                <ng-container matColumnDef="address">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let element">
                        Transaction Id <a href="https://{{etherNet}}/address/{{element.address}}#tokentxns" target="_blank">
                        <i class="fa fa-external-link-square"></i></a>
                    </td>
                </ng-container>

                <ng-container matColumnDef="createDate">
                    <th mat-header-cell *matHeaderCellDef> Date</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label="Date:">
                        {{ element.timeDate | date }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="equityTokens">
                    <th mat-header-cell *matHeaderCellDef> Equity Tokens</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label='Equity Tokens:'>
                        {{ element.shareTokens}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="sharePercent">
                    <th mat-header-cell *matHeaderCellDef> Share(%)</th>
                    <td mat-cell *matCellDef="let element" class="has_label_on_mobile" data-label='Share(%):'>
                        {{ element.share}}
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <mat-paginator [ngStyle]="{display: dataSourceLenth > 5 ? 'block' : 'none'}"
                           [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
        </div>
    </div>
</div>
